# Joint Spatial-Temporal Concept Bottleneck trained from scratch
phase: joint
pretrained_checkpoint: null
checkpoint: null
concept_checkpoint: null
data: ./data/ntu/NTU60_CS.npz
work_dir: ./work_dir/ntu_cs/joint_symbolic_scratch

data_type: j
num_class: 60
num_points: 24
num_people: 2
window_size: 64
train_backbone: true

concept_loss_weight: 0.20
concept_negative_weight: 0.10
symbolic_temperature: 0.70
symbolic_margin: 0.15
symbolic_weight: 0.20
symbolic_start_weight: 0.05
symbolic_mid_weight: 0.10
symbolic_final_weight: 0.20
symbolic_mid_start: 16
symbolic_final_start: 51
kg_s_weight: 0.01
kg_c_weight: 0.005
fusion_start_alpha: 0.10
fusion_mid_alpha: 0.20
fusion_final_alpha: 0.30

epochs: 80
lr: 0.001
weight_decay: 0.0001
batch_size: 64
num_workers: 4
device: 0
seed: 42
explain_every: 10
n_explain_actions: 10
save_score: false
