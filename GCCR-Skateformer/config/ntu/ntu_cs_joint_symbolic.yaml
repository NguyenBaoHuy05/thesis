# Joint Spatial-Temporal Concept Bottleneck + Symbolic Action Compatibility
phase: joint
pretrained_checkpoint: ./pretrained/ntu_cs/SkateFormer_j.pth
checkpoint: ./pretrained/ntu_cs/SkateFormer_j.pth
data: ./data/ntu/NTU60_CS.npz
work_dir: ./work_dir/ntu_cs/joint_symbolic

data_type: j
num_class: 60
num_points: 24
num_people: 2
window_size: 64

# Two coupled objectives: action CE + concept/action symbolic compatibility.
concept_loss_weight: 0.20
concept_negative_weight: 0.10
concept_checkpoint: null
kg_s_weight: 0.02
kg_c_weight: 0.01

# Concept-GCN Architecture (C_KG Graph Adjacency Prior)
use_concept_gcn: true
concept_gcn_dropout: 0.1
symbolic_temperature: 0.70
symbolic_margin: 0.15
symbolic_weight: 0.50
symbolic_start_weight: 0.10
symbolic_mid_weight: 0.30
symbolic_final_weight: 0.50
symbolic_mid_start: 6
symbolic_final_start: 21
fusion_start_alpha: 0.10
fusion_mid_alpha: 0.30
fusion_final_alpha: 0.50

epochs: 30
lr: 0.001
weight_decay: 0.0001
batch_size: 64
num_workers: 4
device: 0
seed: 42
explain_every: 5
n_explain_actions: 10
save_score: false
