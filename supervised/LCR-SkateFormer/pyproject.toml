[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lcr-skateformer"
version = "1.0.0"
description = "Looping Concept Reasoning SkateFormer (LCR-SkateFormer) for Skeleton Action Recognition"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "timm>=0.9.0",
    "pyyaml>=6.0",
    "numpy>=1.20.0",
    "tqdm>=4.64.0",
    "tensorboardX>=2.6",
]
