# Configuration: NTU RGB+D 60 Cross-Subject with CTR-GCN Backbone and Logic Reasoning

# Model Architecture
model_args:
  backbone_name: "ctrgcn"
  backbone_cfg:
    in_channels: 3
    num_class: 60
    num_point: 25
    num_person: 2
    graph: "model.backbones.graph_utils.Graph"
    graph_args:
      layout: "ntu-rgb+d"
      strategy: "spatial"
    drop_out: 0.0
    adaptive: true
  pretrained_backbone: null  # Optional: path to pretrained CTR-GCN weights
  freeze_backbone: false     # Set to true to freeze backbone
  num_classes: 60
  concepts_csv: "concepts/ntu_rgbd_60_120.csv"
  num_rules: 128
  use_not_logic: true
  alpha_init: 0.5
  learnable_alpha: true
  use_clip_alignment: true
  clip_backbone: "ViT-B/32"
  lora_r: 4
  loss_weights:
    final_ce: 1.0
    neural_ce: 0.5
    logic_ce: 0.5
    concept_bce: 1.0
    clip: 0.2
    kg: 0.1
    logic_reg: 0.01

# Dataset & Feeding
feeder: feeders.feeder_ntu.NTUFeeder
train_feeder_args:
  data_path: "data/ntu60_xsub_train.npz"
  split: "train"
  window_size: 64
  p_interval: [0.5, 1.0]
  bone: false
  vel: false
  random_rot: true
  random_move: true
  spatial_flip: true
  concepts_csv: "concepts/ntu_rgbd_60_120.csv"
  num_classes: 60
  debug: false

test_feeder_args:
  data_path: "data/ntu60_xsub_val.npz"
  split: "test"
  window_size: 64
  p_interval: [1.0]
  bone: false
  vel: false
  random_rot: false
  random_move: false
  spatial_flip: false
  concepts_csv: "concepts/ntu_rgbd_60_120.csv"
  num_classes: 60
  debug: false

# Training Optimization
batch_size: 32
test_batch_size: 64
num_worker: 2
base_lr: 0.1
weight_decay: 0.0004
num_epoch: 70
warmup_epochs: 5
lr_decay_rate: 0.1
step: [35, 55]
save_interval: 10
eval_interval: 1
work_dir: "./work_dir/ntu60_ctrgcn_logic"
