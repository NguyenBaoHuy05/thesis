# NeSy on Neuron, ntu60 xsub 55/5. Run from zeroshot/Neuron:
#   python main_nesy.py --config config/nesy/ntu60_xsub_55_5.yaml
split: ntu60_seen55_unseen5
# v1: rule dropout, no person mask, best.pt on zsl_z (the first run, v0, is in nesy_neuron/<split>)
work_dir: /content/drive/MyDrive/BaoHuy/zeroshot/nesy_neuron/v1/ntu60_seen55_unseen5
semantic_dir: ./semantics/ntu
seed: 1

# data: the notebook extracts the Drive npz into /content/data/<name>/*.npy first. Feeder_Mmap memory-maps them
# (RAM ~1-2 GB instead of ~14 / 35 GB); same samples, preprocessing and augmentation as Feeder_Shiftgcn_Match.
feeder: feeders.feeder_ntu_mmap.Feeder_Mmap
num_worker: 8
# cache: the frozen encoder runs once; each training sample gets ONE fixed augmentation (the crop + rotation
# below, seeded per sample), test uses the centre crop. online: new random augmentation every epoch (slow).
feature_mode: cache
# Cubes are fp16 (256 x 16 x 25 per sample): ~11 GB per NTU60 split, ~22 GB per NTU120 split.
# Local disk: re-encoded in each new Colab session (~5-11 min). Use a Drive folder to keep them across sessions.
cache_dir: /content/cube_cache
cache_device: auto     # auto: GPU if the cubes fit, else RAM, else disk (memmap in cache_dir, e.g. on T4) | cuda | cpu | disk
gpu_cache_gb: 14
extract_batch_size: 256
# fixed augmented views per training sample (epoch e uses view e % K). 2 is closer to Neuron, which draws a
# new augmentation every epoch; costs one more extraction and K x the train cache (auto may then use disk).
cache_views: 1
train_feeder_args:
  data_path: /content/data/NTU60_CS
  ntu_task: ntu60_xsub
  zero_spilt_setting: ntu60_seen55_unseen5
  zero_setting: ZSL
  split: train
  window_size: 64
  p_interval: [0.5, 1]
  random_rot: True
# test: deterministic centre crop, no rotation (Neuron's config used the training augmentation here)
test_feeder_args:
  data_path: /content/data/NTU60_CS
  ntu_task: ntu60_xsub
  zero_spilt_setting: ntu60_seen55_unseen5
  zero_setting: GZSL
  split: test
  window_size: 64
  p_interval: [0.95]
  random_rot: False

# model
model: model.nesy.NeuronNeSy
weights: /content/drive/MyDrive/BaoHuy/zeroshot/shiftgcn_weights/**/ntu60_ShiftGCN_joint_xsub_seen55_unseen5-*.pt
model_args:
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: spatial
  primitive_path: ../primitive.json
  rules_path: ../kg_rules.json
  prim_text_path: ./semantics/ntu/primitive_text_clip.pt
  d_sym: 128
  kappa_t: 1.0        # soft max over time (on primitive logits)
  kappa_side: 10.0    # soft max over the left / right rule variants
  beta_init: 0.1      # weight of s_sym in the fused score (learned); small so z starts close to Neuron
  two_person_thr: 0.5
  mask_penalty: 0.0   # person-count mask off: in v1 it lowered ZSL in 28/30 epochs (1000 = hard mask)
  freeze_bn: True     # keep the frozen encoder's BatchNorm statistics fixed
  p_drop: 0.2         # rule dropout: each literal / sequence rule dropped with this probability in training
  neuron_scale: 0.1   # scale of the cosines in Neuron's loss (0.1 = Neuron; its CE then stays at ~ln C)
  neuron_scale_learn: False   # True: learn it, CLIP-style

# optim: Neuron head as in Neuron (SGD), NeSy branch AdamW; same step decay
base_lr: 0.1
nesterov: True
weight_decay: 0.0005
nesy_lr: 0.001
nesy_wd: 0.0001
step: [4, 20]
lr_decay_rate: 0.1
batch_size: 64
test_batch_size: 64
num_epoch: 30

# checkpoints in work_dir: last.pt every epoch (resume=True continues from it), best.pt at max best_metric
best_metric: zsl_z
resume: True

# loss = Neuron + lambda_sym * CE(s_sym) + lambda_fuse * CE(z) + lambda_logic * (exclusive + implication)
lambda_sym: 1.0
lambda_fuse: 1.0
lambda_logic: 0.1
