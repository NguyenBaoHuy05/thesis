work_dir: ./work_dir/ablation/random_pretrain

model: hgcn.hypergcn_large.Model
model_args:
  pretrain_chkpt: ${REASON_PRETRAIN_HGCN:-./checkpoints/hgcn/hgcn_l_j.pt}
  num_class: 120
  spatial_concepts: 52
  temporal_concepts: 26
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: hgcn.graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'

use_concept_refiner: False
logic_model:
  l1_dim: 128
  l2_dim: 128
  use_not: True
  use_skip: True
  temperature: 1.0
  l2_weight: 1.0e-6
  kg_init_mode: random
  kg_prior_strength: 1.0
  kg_prior_map:
    require: []
    alongside: []
    excludes: []

feeder: feeders.feeder_ntu.Feeder
num_worker: 8

train_feeder_args:
  data_path: ${REASON_DATA_PATH:-./data/ntu120/NTU120_CSub.npz}
  concepts_csv: ${REASON_CONCEPTS_CSV:-./concepts/ntu_rgbd_60_120.csv}
  split: train
  random_choose: False
  random_shift: False
  random_move: True
  random_rot: True
  window_size: 64
  p_interval: [0.5, 1]
  normalization: False
  debug: False
  use_mmap: False
  bone: False
  vel: False
  remove_null_concept: True

test_feeder_args:
  data_path: ${REASON_DATA_PATH:-./data/ntu120/NTU120_CSub.npz}
  concepts_csv: ${REASON_CONCEPTS_CSV:-./concepts/ntu_rgbd_60_120.csv}
  split: test
  window_size: 64
  p_interval: [0.95]
  bone: False
  vel: False
  debug: False
  use_mmap: False

batch_size: 64
test_batch_size: 64
num_epoch: 65
weight_decay: 0.0004
base_lr: 0.1
lr_decay_rate: 0.1
step: [35, 55]
warm_up_epoch: 5
seed: 1
use_wandb: False
