# REASON - NTU RGB+D 60, Cross-Subject, Bone stream (Windows)

# WandB
use_wandb: False
wandb_project: SkeletonACLv5
wandb_entity: null
wandb_name: ntu60_xsub_bone

# Output
work_dir: ./work_dir/ntu60/xsub/bone_bnfix
phase: train
seed: 1
print_log: True
log_interval: 100
save_interval: 2
save_epoch: 30
eval_interval: 1
show_topk: [1, 5]

# Model
model: hgcn.hypergcn_large.Model
model_args:
  pretrain_chkpt: HyperGCN/large/ntu60/xsub/bone/runs-132-82632.pt
  num_class: 60
  spatial_concepts: 53
  temporal_concepts: 21
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: hgcn.graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'

use_concept_refiner: False
freeze_backbone_bn: True

# Logic model
logic_model:
  l1_dim: 128
  l2_dim: 128
  use_not: True
  use_skip: True
  temperature: 1.0
  l2_weight: 1.0e-6

# Feeder
feeder: feeders.feeder_ntu.Feeder
num_worker: 0

train_feeder_args:
  data_path: data/ntu/NTU60_CS.npz
  concepts_csv: concepts/ntu_rgbd_60_120.csv
  split: train
  random_choose: False
  random_shift: False
  random_move: True
  random_rot: True
  window_size: 64
  p_interval: [0.5, 1]
  normalization: False
  debug: False
  use_mmap: False
  bone: True
  vel: False
  remove_null_concept: False

test_feeder_args:
  data_path: data/ntu/NTU60_CS.npz
  concepts_csv: concepts/ntu_rgbd_60_120.csv
  split: test
  window_size: 64
  p_interval: [0.95]
  bone: True
  vel: False
  debug: False
  use_mmap: False
  normalization: False
  remove_null_concept: False

# Optimization
base_lr: 0.02
momentum: 0.9
nesterov: True
weight_decay: 0.0005
step: [110, 120]
lr_decay_rate: 0.1
clip_lr: 1.0e-5
clip_weight_decay: 0.01
clip_betas: [0.9, 0.98]
concept_lr: 5.0e-6
concept_weight_decay: 1.0e-2
concept_min_lr: 1.0e-7
crl_lr: 5.0e-5
crl_min_lr: 1.0e-6

# Training schedule
batch_size: 164
test_batch_size: 164
start_epoch: 0
num_epoch: 200
warm_up_epoch: 5
warm_up_epoch_logic: 15
logic_lr_type: cosine
concept_smoothing: 0.1
contrastive_weight: 0.1

# Device and checkpoints
device: [0]
weights: null
ignore_weights: []
save_score: False

# LoRA
lora_args:
  alpha: 32
  backbone: ViT-B/32
  batch_size: 32
  clip_lr: 0.0005
  dataset: imagenet
  dropout_rate: 0.1
  encoder: both
  eval_only: false
  filename: lora_weights
  gcn_lr: 0.05
  lr: 0.01
  n_iters: 500
  params: [q, k]
  position: all
  r: 16
  root_path: ''
  save_path: ./work_dir/lora/
  seed: 1
  shots: 16

body_parts: ['head', 'hand', 'arm', 'hip', 'leg', 'foot', 'full_body']
