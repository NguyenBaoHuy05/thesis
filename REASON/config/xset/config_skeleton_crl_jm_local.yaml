# Skeleton CRL Training Configuration
# Local (Windows) copy of config_skeleton_crl_jm.yaml with paths adjusted for
# this machine. See config_skeleton_crl_jm.yaml for the original author config.

# WandB configuration
use_wandb: False
wandb_project: SkeletonACLv5
wandb_entity: null  # Set to your WandB username
wandb_name: temp_implies_iff

# Work directory
work_dir: ./work_dir/ntu120/xset/joint_motion

# Phase
phase: train

# Random seed
seed: 1

# Logging
print_log: True
log_interval: 100
save_interval: 2
save_epoch: 30
eval_interval: 1
show_topk: [1, 5]

# Model
model: hgcn.hypergcn_large.Model
model_args:
  pretrain_chkpt: HyperGCN/large/ntu120/xset/joint_motion/runs-140-119140.pt
  num_class: 120
  # concepts/ntu_rgbd_60_120.csv has 52 body-part + 21 temporal + 1 interaction = 74
  # concept columns and no 'null_concept' placeholder columns (unlike the original
  # feeders/ntu_rgbd_spatial_temporal.csv this config was authored against, which
  # isn't included in this repo). The feeder's split_vector() folds the single
  # interaction concept into the 'full_body' group (52+1=53), concatenated with
  # 'temporal' (21) to form the 74-d concept target - so spatial_concepts here
  # must be 53, not 52, and remove_null_concept below must be False.
  spatial_concepts: 53
  temporal_concepts: 21
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: hgcn.graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'

use_concept_refiner: False
# Keep pretrained HyperGCN BatchNorm running statistics fixed during fine-tuning.
freeze_backbone_bn: True
# CRL-specific parameters
logic_model:
  l1_dim: 128
  l2_dim: 128
  use_not: True
  use_skip: True
  temperature: 1.0
  l2_weight: 1.0e-6 #5.0e-6

# Feeder
feeder: feeders.feeder_ntu.Feeder
# Windows note: the feeder loads the full .npz into a plain numpy array (not
# mmap'd), and Windows DataLoader workers use 'spawn' (no copy-on-write like
# Linux fork), so each worker would otherwise re-serialize/duplicate the
# ~20GB array. num_worker: 0 runs data loading in the main process only,
# avoiding that duplication (safe default here; raise later only if you've
# confirmed enough free RAM per extra worker).
num_worker: 0

train_feeder_args:
  data_path: data/ntu120/NTU120_CSet.npz
  concepts_csv: concepts/ntu_rgbd_60_120.csv
  split: train
  random_choose: False
  random_shift: False
  random_move: False
  random_rot: False
  window_size: 64
  p_interval: [0.5, 1]
  normalization: False
  debug: False
  use_mmap: False
  bone: False
  vel: True
  remove_null_concept: False

test_feeder_args:
  data_path: data/ntu120/NTU120_CSet.npz
  concepts_csv: concepts/ntu_rgbd_60_120.csv
  split: test
  window_size: 64
  p_interval: [0.95]
  bone: False
  vel: True
  debug: False
  use_mmap: False
  remove_null_concept: False

# =============================================================================
# OPTIMIZATION PARAMETERS
# =============================================================================

# GCN optimizer (SGD with momentum)
base_lr: 0.02
momentum: 0.9
nesterov: True
weight_decay: 0.0005
step: [110, 120]  # LR decay steps
lr_decay_rate: 0.1

# CLIP optimizer (AdamW)
clip_lr: 5.0e-4
clip_weight_decay: 0.01
clip_betas: [0.9, 0.98]
clip_warmup_start_factor: 0.02  # Start at 2% of clip_lr
clip_min_lr: 1.0e-6

# Concept predictors optimizer (AdamW, lower LR per CRL paper)
concept_lr: 5.0e-6  # base_lr / 100 as per CRL paper
concept_weight_decay: 1.0e-2
concept_min_lr: 1.0e-7

# CRL logic layers optimizer (AdamW)
crl_lr: 5.0e-5
crl_min_lr: 1.0e-6

# Training schedule
batch_size: 164
test_batch_size: 164
start_epoch: 0
num_epoch: 200 # 140
warm_up_epoch: 5
warm_up_epoch_logic: 15
logic_lr_type: cosine
concept_smoothing: 0.1 # 0.0 for no smoothing

# Loss weights
contrastive_weight: 0.1  # CLIP alignment loss weight

# Device
device: [0]

# Weights
weights: null
ignore_weights: []

# Save score
save_score: False

# LoRA args
lora_args:
  alpha: 32
  backbone: ViT-B/32
  batch_size: 32
  clip_lr: 0.0005
  dataset: imagenet
  dropout_rate: 0.1
  encoder: both
  eval_only: false
  filename: lora_weights
  gcn_lr: 0.05
  lr: 0.01
  n_iters: 500
  params: [q, k]
  position: all
  r: 16
  root_path: ''
  save_path: ./work_dir/lora/
  seed: 1
  shots: 16

# Concepts and body parts
body_parts: ['head', 'hand', 'arm', 'hip', 'leg', 'foot', 'full_body']
