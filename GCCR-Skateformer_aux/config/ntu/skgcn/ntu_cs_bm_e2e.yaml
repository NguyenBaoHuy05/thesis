# SK-GCN Bone-Motion Modality - Phase 2: end-to-end fine-tuning
# Resumes from the Phase-1 frozen-backbone symbolic run
# (config/ntu/skgcn/ntu_cs_bm.yaml) and continues training with the backbone
# unfrozen. Point `resume_checkpoint` at that run's joint_best.pt (or
# joint_final.pt) and set `start_epoch` to one past its last completed
# epoch so the symbolic/fusion-alpha and cosine-LR schedules continue
# smoothly instead of resetting.
phase: joint
backbone: skgcn
resume_checkpoint: ./work_dir/ntu_cs/skgcn_bm_symbolic/joint_best.pt
train_backbone: true
data: ./data/ntu/NTU60_CS.npz
work_dir: ./work_dir/ntu_cs/skgcn_bm_symbolic_e2e

data_type: bm
num_class: 60
num_points: 25
num_people: 2
window_size: 64

concept_loss_weight: 0.20
concept_negative_weight: 0.10
concept_checkpoint: null
kg_s_weight: 0.02
kg_c_weight: 0.01
aux_kg_weight: 0.05

# Phase 1 ran epochs 1-30, so Phase 2 picks up at epoch 31 and extends the
# same schedule horizon to epoch 50.
start_epoch: 31
epochs: 50
lr: 0.001
backbone_lr_mult: 0.1
weight_decay: 0.0001
batch_size: 64
num_workers: 4
device: 0
seed: 42
explain_every: 5
n_explain_actions: 10
save_score: true
