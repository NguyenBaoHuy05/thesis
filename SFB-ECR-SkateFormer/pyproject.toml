[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sfb-ecr-skateformer"
version = "1.0.0"
description = "ECR-SkateFormer with Concept-Guided Soft Feedback Attention"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "timm>=0.9.0",
    "tensorboardX>=2.6",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "numpy>=1.22.0",
]
