work_dir: ./work_dir/ntu120/xsub/synergy_p1_frozen

# Phase P1 (feasibility): the whole backbone is frozen, no semantic hyperedges;
# only the (untied) synergy bottleneck trains on frozen l9 features.
# Go on if Top1 >= 75%; below 65% revisit the bank.
# --weights: official Hyper-GCN large joint checkpoint.
weights: /content/large/ntu120/xsub/joint/runs-122-120048.pt
freeze_until: l9

feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: /content/drive/MyDrive/BaoHuy/KLTN_Huy-Nhu/NTU120_CSub.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  random_rot: True
  vel: False
  bone: False
  p_interval: [0.5, 1]

test_feeder_args:
  data_path: /content/drive/MyDrive/BaoHuy/KLTN_Huy-Nhu/NTU120_CSub.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

model: model.hypergcn_large.Model
model_args:
  num_class: 120
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'
  synergy_enabled: True
  synergy_bank_kind: semantic
  synergy_use_pair: True
  synergy_segments: 4
  synergy_layers: []
  synergy_readout: embedding
  synergy_tied: False
  synergy_gate_hidden: 64
  synergy_gate_weight: 0.001

weight_decay: 0.0001
optimizer: Adam
base_lr: 0.001
lr_decay_rate: 0.1
step: [6, 8]
warm_up_epoch: 1

device: [0]
num_worker: 6
batch_size: 64
test_batch_size: 256
num_epoch: 10
save_epoch: 0
eval_interval: 2
eval_epoch: 6
