work_dir: ./work_dir/ntu120/xsub/synergy

# Main model M (SEMANTIC_HYPERGRAPH_PLAN.md, phase P2): l1-l6 frozen, l7-l9
# fine-tuned at backbone_lr_scale with semantic hyperedges (beta = 0 at start),
# tied synergy bottleneck with embedding readout, 19 + 5 synergies, 4 segments.
# --weights: official Hyper-GCN large joint checkpoint.
weights: /content/large/ntu120/xsub/joint/runs-122-120048.pt
freeze_until: l6
backbone_lr_scale: 0.1

feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: /content/drive/MyDrive/BaoHuy/KLTN_Huy-Nhu/NTU120_CSub.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  random_rot: True
  vel: False
  bone: False
  p_interval: [0.5, 1]

test_feeder_args:
  data_path: /content/drive/MyDrive/BaoHuy/KLTN_Huy-Nhu/NTU120_CSub.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

model: model.hypergcn_large.Model
model_args:
  num_class: 120
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'
  synergy_enabled: True
  synergy_bank_kind: semantic
  synergy_use_pair: True
  synergy_segments: 4
  synergy_layers: [l7, l8, l9]
  synergy_readout: embedding
  synergy_tied: True
  synergy_gate_hidden: 64
  synergy_gate_weight: 0.001
  synergy_entropy_weight: 0.0

weight_decay: 0.0001
optimizer: Adam
base_lr: 0.001
lr_decay_rate: 0.1
step: [20, 26]
warm_up_epoch: 2

device: [0]
num_worker: 6
batch_size: 64
test_batch_size: 64
num_epoch: 30
save_epoch: 0
eval_interval: 2
eval_epoch: 20
