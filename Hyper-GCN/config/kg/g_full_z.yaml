# A1-G G2 (diagnostic): graph RETRIEVE -> VERIFY (opposed attributes, normalized) with a = sigmoid(W_a z).
# Expected to reproduce the ECOC shortcut of A1 (a learned from z with class-derived targets).
# K2-z: --kg annotations/kg_shuffled/action_kg_shuffle_s<seed>.json.
# V-std / V-mstd: --head-arg verify_mode=std | masked_std. V-nonorm: --head-arg normalize_verify=False.
# lambda-fix: --head-arg learn_lambda=False.
work_dir: ./work_dir/kg/g_full_z

kg: annotations/action_kg.json

cache_dir: ./kg_cache
cache_name: ntu120_xsub

head: a1
head_args:
  k: 10
  tau: 0.07
  learn_tau: True
  feature_dropout: 0.1
  retrieval_source: graph
  graph_args:                  # as config/kg/g1.yaml
    d: 256
    layers: 2
    dropout: 0.1
    init: learned
  attribute_source: z
  verify_mode: opposed         # d = 1 iff some candidate has the attribute and another lacks it
  normalize_verify: True       # v_c / n_c
  tau_pi: 0.1                  # only used by verify_mode std / masked_std
  uniform_pi: False
  uniform_d: False
  use_verify: True
  use_fuse: False              # FUSE is an ablation in A1-G
  lambda_init: 1.0
  learn_lambda: True

loss:
  alpha: 0.5                   # CE_all on the retrieval scores s
  beta: 0.5                    # masked BCE of the attribute head
  gamma: 0.0                   # no FUSE
feature_noise: 0.0

epochs: 30
batch_size: 512
lr: 0.001
weight_decay: 0.0
seed: 0
