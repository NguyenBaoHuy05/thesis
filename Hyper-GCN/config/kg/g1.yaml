# A1-G G1: RETRIEVE on the graph only. s_c = cos(P z, g_c) / tau, g = x + R-GCN(x, KG)
# (model/graph_encoder.py). Node vectors x learned from scratch, no text embeddings.
# G1-0 (no edges): --head-arg layers=0. G1-K2: --kg annotations/kg_shuffled/action_kg_shuffle_s<seed>.json.
# G1-init: --head-arg init=text --embeddings <npz> (add embeddings: below).
# Recipe fixed in advance (no validation split), same optimizer as K1.
work_dir: ./work_dir/kg/g1

kg: annotations/action_kg.json

cache_dir: ./kg_cache
cache_name: ntu120_xsub

head: g1
head_args:
  tau: 0.07                    # initial value; learned, clamped to [0.01, 1]
  learn_tau: True
  feature_dropout: 0.1
  d: 256                       # node / query dimension
  layers: 2                    # R-GCN layers; 0 = free node vectors (G1-0)
  dropout: 0.1
  init: learned                # learned | text
feature_noise: 0.0

epochs: 30
batch_size: 512
lr: 0.001
weight_decay: 0.0
seed: 0
