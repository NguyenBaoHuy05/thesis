# A1 full head: RETRIEVE -> VERIFY -> FUSE (A1 plan S1). K2 = this config with
# --kg annotations/kg_shuffled/action_kg_shuffle_s<seed>.json (same embeddings file).
# Recipe fixed in advance (no validation split): A1 plan S1.1 + option-1 regularization.
work_dir: ./work_dir/kg/a1

kg: annotations/action_kg.json
embeddings: annotations/kg_emb_mpnet.npz
embedding_key: action

cache_dir: ./kg_cache
cache_name: ntu120_xsub

head: a1
head_args:
  k: 10
  tau: 0.07                    # retrieval temperature, learned, clamped to [0.01, 1]
  learn_tau: True
  feature_dropout: 0.1
  tau_pi: 0.1                  # fixed candidate-weight temperature for d_attr (A1_PROGRESS.md, P3)
  uniform_pi: False            # True: pi = 1/k
  uniform_d: False             # True: A1-d (d = 1)
  use_verify: True             # False: K3
  use_fuse: True               # False: K4
  lambda_init: 1.0
  learn_lambda: True           # False: K4' (lambda fixed at lambda_init)
  d_model: 256
  heads: 4

loss:
  alpha: 0.5                   # CE_all on the retrieval scores s
  beta: 0.5                    # masked BCE of the attribute head
  gamma: 0.1                   # mean|f| / sg(mean(|s_c| + |lambda v|)); 0 = plan default
feature_noise: 0.0

epochs: 30
batch_size: 512
lr: 0.001
weight_decay: 0.0
seed: 0
