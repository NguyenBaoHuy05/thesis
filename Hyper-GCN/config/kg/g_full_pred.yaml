# A1-G G4 (main result): graph RETRIEVE -> VERIFY (opposed, normalized) with a from geometric
# predicates phi (model/predicates.py, cached by tools/cache_predicates.py): two parameters per
# predicate, so the evidence cannot learn to recognize the class.
# K2-pred: --kg annotations/kg_shuffled/action_kg_shuffle_s<seed>.json.
# Fixed thresholds (no learning at all): set predicates.learn_threshold False.
work_dir: ./work_dir/kg/g_full_pred

kg: annotations/action_kg.json

cache_dir: ./kg_cache
cache_name: ntu120_xsub

predicates:
  cache_name: ntu120_xsub_pred # <cache_dir>/ntu120_xsub_pred_{train,test}.npz
  names: all                   # every cached predicate that is an attribute of the KG
  min_train_auc: 0.75          # keep predicates whose AUC vs the KG on the TRAIN split reaches this
                               # (null = keep all). Shuffled KG: AUC is computed against that KG,
                               # so K2 keeps the predicates that happen to fit the shuffled edges
  learn_threshold: True

head: a1
head_args:
  k: 10
  tau: 0.07
  learn_tau: True
  feature_dropout: 0.1
  retrieval_source: graph
  graph_args:
    d: 256
    layers: 2
    dropout: 0.1
    init: learned
  attribute_source: predicate
  verify_mode: opposed
  normalize_verify: True
  tau_pi: 0.1
  uniform_pi: False
  uniform_d: False
  use_verify: True
  use_fuse: False
  lambda_init: 1.0
  learn_lambda: True

loss:
  alpha: 0.5
  beta: 0.5                    # BCE fits theta / scale of each predicate on the KG-known cells
  gamma: 0.0
feature_noise: 0.0

epochs: 30
batch_size: 512
lr: 0.001
weight_decay: 0.0
seed: 0
