# A1-G + THEN: the G4 recipe of the handoff (predicates selected per KG pair, feature noise 4) on the KG
# with temporal-order attributes (tools/add_then_attributes.py -> annotations/action_kg_then.json).
# Needs the predicate cache rebuilt with the THEN predicates (tools/cache_predicates.py).
# Controls: --kg annotations/kg_then_shuffled/action_kg_shuffle_s0.json (K2, with --predicates-from)
#           --kg annotations/action_kg_then_reversed.json (THEN edges reversed, with --predicates-from)
work_dir: ./work_dir/kg/g_then_pred

kg: annotations/action_kg_then.json

cache_dir: ./kg_cache
cache_name: ntu120_xsub

predicates:
  cache_name: ntu120_xsub_pred_then # tools/cache_predicates.py --name ntu120_xsub_pred_then (45 predicates)
  names: all                   # every cached predicate that is an attribute of the KG
  select: pair                 # AUC inside the KG pairs where the predicate is opposed
  min_train_auc: 0.75          # keep predicates whose AUC vs the KG on the TRAIN split reaches this
                               # (null = keep all). Shuffled KG: AUC is computed against that KG,
                               # so K2 keeps the predicates that happen to fit the shuffled edges
  learn_threshold: True

head: a1
head_args:
  k: 10
  tau: 0.07
  learn_tau: True
  feature_dropout: 0.1
  retrieval_source: graph
  graph_args:
    d: 256
    layers: 2
    dropout: 0.1
    init: learned
  attribute_source: predicate
  verify_mode: opposed
  normalize_verify: True
  tau_pi: 0.1
  uniform_pi: False
  uniform_d: False
  use_verify: True
  use_fuse: False
  lambda_init: 1.0
  learn_lambda: True

loss:
  alpha: 0.5
  beta: 0.5                    # BCE fits theta / scale of each predicate on the KG-known cells
  gamma: 0.0
feature_noise: 4.0

epochs: 30
batch_size: 512
lr: 0.001
weight_decay: 0.0
seed: 0
