# A1 option 2: attribute decoder on the l9 map before pooling, shuffled KG s0 (control).
# Backbone frozen (freeze_until l9): only the head + decoder train, so the change against the cache
# head is the decoder alone. a = sigmoid(W_a z) is replaced; z still feeds RETRIEVE and the FUSE
# query. ft_a1_dec.yaml and ft_a1_dec_k2.yaml differ only in `kg`, `head_weights`, `work_dir`.
# Fixed in advance; select_best False reports the last epoch.
work_dir: ./work_dir/kg_ft/a1_dec_k2

# feeder (as config/large/nturgbd120-cross-subject/hyper_joint.yaml)
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/ntu120/NTU120_CSub.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  random_rot: True
  p_interval: [0.5, 1]
  vel: False
  bone: False

test_feeder_args:
  data_path: data/ntu120/NTU120_CSub.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

# model
model: model.hypergcn_kg.Model
model_args:
  num_class: 120
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'
  kg: annotations/kg_shuffled/action_kg_shuffle_s0.json
  embeddings: /content/drive/MyDrive/BaoHuy/kg_emb_mpnet.npz
  head_weights: /content/drive/MyDrive/BaoHuy/kg_heads/a1_k2_s0.pt    # train_kg_head.py, config/kg/a1.yaml, --kg shuffle s0, seed 0
  head_args:                   # must match config/kg/a1.yaml
    k: 10
    tau: 0.07
    learn_tau: True
    feature_dropout: 0.1
    tau_pi: 0.1
    uniform_pi: False
    uniform_d: False
    use_verify: True
    use_fuse: True
    lambda_init: 1.0
    learn_lambda: True
    d_model: 256
    heads: 4
    attribute_source: decoder  # model/attribute_decoder.py
    mirror_body_parts: True    # KG hand_R also opens the left hand (model/kg.py: attribute_joint_mask)
    decoder_args:
      d_model: 256
      heads: 4
      layers: 2
      dropout: 0.1
      max_frames: 64           # l9 has 16 frames for window_size 64
kg_loss:
  alpha: 0.5
  beta: 0.5
  gamma: 0.1

weights: /content/large/ntu120/xsub/joint/runs-122-120048.pt
freeze_until: l9               # whole backbone frozen
lr_scale:
  kg.decoder.: 10              # from scratch: 0.025, the original Hyper-GCN lr
eval_before_train: True        # epoch 0 = cache head with VERIFY off (a = 0.5)
select_best: False

# optim
weight_decay: 0.0004
base_lr: 0.0025
lr_decay_rate: 0.1
step: [10]
warm_up_epoch: 0
nesterov: True

# training
device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 15
save_epoch: 0
save_interval: 5
eval_interval: 5
eval_epoch: 15
seed: 0
