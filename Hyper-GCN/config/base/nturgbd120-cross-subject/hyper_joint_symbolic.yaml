work_dir: ./work_dir/ntu120/xsub/joint_grounded_v2_tversky

# Supply a matching official checkpoint with --weights.
symbolic_only: True

feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/ntu120/NTU120_CSub.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  random_rot: True
  vel: False
  bone: False
  p_interval: [0.5, 1]

test_feeder_args:
  data_path: data/ntu120/NTU120_CSub.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

model: model.hypergcn_base.Model
model_args:
  num_class: 120
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: virtual_ensemble
  symbolic_graph_enabled: True
  concept_csv: concepts/ntu_action_concept_v2_4.csv
  metadata_csv: concepts/ntu_concept_metadata_v2_4.csv
  num_concepts: 102
  symbolic_graph_weight: 0.10
  symbolic_graph_temperature: 0.20
  symbolic_concept_dim: 64
  symbolic_temporal_bins: 4
  symbolic_grounding_dropout: 0.10
  symbolic_balance_loss: True
  symbolic_pos_weight_max: 10.0
  symbolic_pos_weight_source: train
  # No black-box FC: grounded concepts -> fixed matrix -> Tversky action score.
  symbolic_action_mode: prototype
  symbolic_action_decoder: tversky
  symbolic_action_temperature: 0.15
  symbolic_action_missing_weight: 1.0
  symbolic_action_extra_weight: 0.15
  symbolic_action_idf_weighting: True
  symbolic_action_idf_min: 0.5
  symbolic_action_idf_max: 2.0
  # Global concept-hyperedge incidence remains anchored to body/group/scope.
  symbolic_hypergraph_mode: learnable_v1
  symbolic_hypergraph_reg_weight: 0.01

weight_decay: 0.0004
# One-stage concept-to-action training; pretrained backbone/classifier remain frozen.
optimizer: Adam
base_lr: 0.0003
lr_decay_rate: 0.1
step: [12, 17]
warm_up_epoch: 1

device: [0]
num_worker: 0
batch_size: 64
test_batch_size: 64
num_epoch: 20
save_epoch: 0

