# P2 E2-alpha: E2 with learned edge weights.
work_dir: ./work_dir/concept_graph/e2_alpha

cache_dir: ./kg_cache
cache_name: ntu120_xsub_joint            # tools/cache_joint_features.py --segments 1

matrix: annotations/concepts/ntu_action_concept_v2_4.csv
metadata: annotations/concepts/ntu_concept_metadata_v2_4.csv
head: graph
graph:
  kind: full
  nots: True
  seed: 0                            # only used by kind: random
head_args:
  omega: 1.0                         # closed-world NOT over absent concepts (CL v2: 1)
  nu: 1.0                            # weight of the NOT(j|i) literals
  learn_alpha: True                  # edge weights a = softplus(theta), init 1
  eta: 1.0e-4                        # sum |a - 1|
  tau: 0.1
  learn_tau: True
  decoder_args:
    d_model: 256
    heads: 4
    layers: 2
    dropout: 0.1

loss:
  beta: 0.5                          # BCE of the concepts against the class row of the matrix

epochs: 30
batch_size: 256
lr: 0.001
weight_decay: 0.0
seed: 0
feature_noise: 1.0                   # as CL v2
