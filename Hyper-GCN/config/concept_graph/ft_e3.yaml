# Light fine-tuning, the E3 graph as a feature refinement of K0 (model/hypergcn_concept.py): f' = f + W [LN(r) ; c],
# W = 0 at the start, logits = fc(f'). l9, fc and the graph train; the graph starts from E3's head.pt (cache S = 1).
# Same recipe as ft_k0.yaml (the control); fixed before running; select_best False reports the last epoch (15).
work_dir: ./work_dir/concept_graph/ft_e3

# feeder (as config/large/nturgbd120-cross-subject/hyper_joint.yaml)
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/ntu120/NTU120_CSub.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  random_rot: True
  p_interval: [0.5, 1]
  vel: False
  bone: False

test_feeder_args:
  data_path: data/ntu120/NTU120_CSub.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

# model
model: model.hypergcn_concept.Model
model_args:
  num_class: 120
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'
  head_weights: /content/drive/MyDrive/BaoHuy/work_dir/concept_graph/e3/head.pt
  concept_args:                      # as config/concept_graph/e3.yaml (head_args must match head.pt)
    matrix: annotations/concepts/ntu_action_concept_v2_4.csv
    metadata: annotations/concepts/ntu_concept_metadata_v2_4.csv
    graph:
      kind: full
      nots: True
    beta: 0.5                        # BCE of the concepts
    head_weight: 1.0                 # the head's own losses (CE + beta BCE + aux / kl / margin / alpha)
    head_args:
      omega: 1.0
      nu: 1.0
      learn_alpha: True
      eta: 1.0e-4
      tau: 0.1
      learn_tau: True
      lam: 0.5
      gamma: 0.5
      mu: 0.5
      margin: 0.1
      aux_weight: 0.1
      token_drop: 0.3
      use_rgcn: True
      freeze_node_emb: False
      rgcn_args:
        bases: 4
        use_r6: True
        dropout: 0.1
      decoder_args:
        d_model: 256
        heads: 4
        layers: 2
        dropout: 0.1
      action_decoder_args:
        layers: 1

weights: /content/large/ntu120/xsub/joint/runs-122-120048.pt
freeze_until: l8               # light fine-tuning: l9 (+ fc) only
eval_before_train: True        # epoch 0 must reproduce K0 (87.63)
select_best: False

# optim
weight_decay: 0.0004
base_lr: 0.0025
lr_decay_rate: 0.1
step: [10]
warm_up_epoch: 0
lr_scale:
  cg.proj.: 10                       # the refinement layer starts at 0; the rest of the graph is pretrained
nesterov: True

# training
device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 15
save_epoch: 0
save_interval: 5
eval_interval: 5
eval_epoch: 15
seed: 0
