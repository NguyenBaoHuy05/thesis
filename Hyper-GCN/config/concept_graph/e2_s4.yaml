# P2 E2-S4: E2 on the S = 4 cache (time order visible to the decoder).
work_dir: ./work_dir/concept_graph/e2_s4

cache_dir: ./kg_cache
cache_name: ntu120_xsub_joint_s4         # tools/cache_joint_features.py --segments 4

matrix: annotations/concepts/ntu_action_concept_v2_4.csv
metadata: annotations/concepts/ntu_concept_metadata_v2_4.csv
head: graph
graph:
  kind: full
  nots: True
  seed: 0                            # only used by kind: random
head_args:
  omega: 1.0                         # closed-world NOT over absent concepts (CL v2: 1)
  nu: 1.0                            # weight of the NOT(j|i) literals
  learn_alpha: False                 # edge weights fixed to 1
  tau: 0.1
  learn_tau: True
  decoder_args:
    d_model: 256
    heads: 4
    layers: 2
    dropout: 0.1

loss:
  beta: 0.5                          # BCE of the concepts against the class row of the matrix

epochs: 30
batch_size: 256
lr: 0.001
weight_decay: 0.0
seed: 0
feature_noise: 1.0                   # as CL v2
