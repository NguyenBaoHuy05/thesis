# Light fine-tuning, control K0-ft: the recipe of ft_e3.yaml without the concept graph (plain Hyper-GCN large,
# label-smoothed CE + divergence loss). Separates "fine-tuning l9 helps" from "the graph helps".
# Fixed before running; select_best False reports the last epoch (15).
work_dir: ./work_dir/concept_graph/ft_k0

# feeder (as config/large/nturgbd120-cross-subject/hyper_joint.yaml)
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/ntu120/NTU120_CSub.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  random_rot: True
  p_interval: [0.5, 1]
  vel: False
  bone: False

test_feeder_args:
  data_path: data/ntu120/NTU120_CSub.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

# model
model: model.hypergcn_large.Model
model_args:
  num_class: 120
  num_point: 25
  num_person: 2
  hyper_joints: 3
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'

weights: /content/large/ntu120/xsub/joint/runs-122-120048.pt
freeze_until: l8               # light fine-tuning: l9 (+ fc) only
eval_before_train: True        # epoch 0 must reproduce K0 (87.63)
select_best: False

# optim
weight_decay: 0.0004
base_lr: 0.0025
lr_decay_rate: 0.1
step: [10]
warm_up_epoch: 0
nesterov: True

# training
device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 15
save_epoch: 0
save_interval: 5
eval_interval: 5
eval_epoch: 15
seed: 0
