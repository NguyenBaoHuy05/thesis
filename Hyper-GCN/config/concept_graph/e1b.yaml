# P1 E1b: CL v2 concept decoder + REASON's logic layers (model/reason_logic.py, 128/128, NOT, skip, linear head).
# REASON's recipe for the logic layers: lr 1e-4, grad-norm clip 0.5 (decoder: config lr, clip 1.0).
# Run 1 (one lr 1e-3, no clip) collapsed: train top1 4.45%.
work_dir: ./work_dir/concept_graph/e1b

cache_dir: ./kg_cache
cache_name: ntu120_xsub_joint        # tools/cache_joint_features.py --segments 1

matrix: annotations/concepts/ntu_action_concept_v2_4.csv
metadata: annotations/concepts/ntu_concept_metadata_v2_4.csv
head: reason
head_args:
  l2_weight: 1.0e-6                  # REASON config_skeleton_crl.yaml
  logic_lr: 1.0e-4                   # REASON main.py: logic_layers_lr
  clip_decoder: 1.0                  # REASON main.py: clip_grad_norm_ heads 1.0, logic 0.5
  clip_logic: 0.5
  logic_args:
    l1_dim: 128
    l2_dim: 128
    use_not: True
    use_skip: True
    temperature: 1.0
  decoder_args:
    d_model: 256
    heads: 4
    layers: 2
    dropout: 0.1

loss:
  beta: 0.5                          # BCE of the concepts against the class row of the matrix

epochs: 30
batch_size: 256
lr: 0.001
weight_decay: 0.0
seed: 0
feature_noise: 1.0                   # as CL v2
