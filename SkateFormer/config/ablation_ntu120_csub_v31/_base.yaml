# Shared, locked NTU120-CSub protocol for the V2-R/V3 decoder ablations.
# Every run uses the complete official training split and evaluates only the
# final epoch on the official test split.
seed: 1
device: [0]
num_worker: 0
num_classes: 120
num_concepts: 102
concept_csv: ./concepts/ntu_action_concept_v2_4.csv
metadata_csv: ./concepts/ntu_concept_metadata_v2_4.csv
weights: /kaggle/input/datasets/nguyenbaohuy05/skateformer-pretrain/ntu120_CSub/SkateFormer_j.pt

train_feeder_args:
  data_path: /kaggle/input/datasets/nguyenbaohuy05/ntu120csubfull/NTU120_CSub.npz
  split: train
  data_type: j
  debug: false
  window_size: 64
  p_interval: [0.5, 1]
  aug_method: a123489
  intra_p: 0.5
  inter_p: 0.2
  thres: 64
  uniform: true
  partition: true

test_feeder_args:
  data_path: /kaggle/input/datasets/nguyenbaohuy05/ntu120csubfull/NTU120_CSub.npz
  split: test
  data_type: j
  debug: false
  window_size: 64
  p_interval: [0.95]
  thres: 64
  uniform: true
  partition: true

model_args:
  num_people: 2
  num_points: 24
  kernel_size: 7
  num_heads: 32
  attn_drop: 0.5
  head_drop: 0.0
  rel: true
  drop_path: 0.2
  type_1_size: [8, 8]
  type_2_size: [8, 12]
  type_3_size: [8, 8]
  type_4_size: [8, 12]
  mlp_ratio: 4.0
  index_t: true

prototype_args:
  multi_scale: false
  pyramid_levels: [2, 3]
  temporal_pooling: legacy_noisy_or
  scale_fusion: shared
  interaction_reasoning: true
  scope_fusion: bounded
  scope_scale: 0.25
  parent_enabled: true

residual_action_head: false
residual_action_weight: 0.1
action_logit_scale: 2.0
concept_score_mode: logit
concept_idf_power: 1.0
batch_size: 64
test_batch_size: 32
test_p_interval: [0.95]
base_lr: 0.0001
weight_decay: 0.0001
grad_clip: 1.0
stage1_epochs: 5
stage2_epochs: 10
stage3_epochs: 0

checkpoint_max_missing_ratio: 0.02

loss_weights:
  concept: 0.25
  parent: 0.25
  graph: 0.00
  center: 0.05

stage1_loss_weights:
  concept: 0.10
  parent: 1.00
  graph: 0.00
  center: 0.10

stage2_loss_weights:
  concept: 0.25
  parent: 0.25
  graph: 0.00
  center: 0.05

stage1_lr: 0.0001
stage2_lr: 0.00005
stage3_decoder_lr: 0.00005
stage3_backbone_lr: 0.00001
