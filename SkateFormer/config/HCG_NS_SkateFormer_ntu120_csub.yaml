# Main HCG-NS model evolved from the selected V3-E ablation.
# It jointly trains grounding and symbolic composition, warms the graph loss,
# and uses pairwise-gap hard-negative center regularization. Historical V3
# configs remain under ablation_ntu120_csub_v31 for exact reproducibility.
seed: 1
device: [0]
num_worker: 0
num_classes: 120
num_concepts: 102

concept_csv: ./concepts/ntu_action_concept_v2_4.csv
metadata_csv: ./concepts/ntu_concept_metadata_v2_4.csv
weights: /kaggle/input/datasets/nguyenbaohuy05/skateformer-pretrain/ntu120_CSub/SkateFormer_j.pt
work_dir: ./work_dir/hcg_ns/main_ntu120_csub_pose_motion_gru_refiner

train_feeder_args:
  data_path: /kaggle/input/datasets/nguyenbaohuy05/ntu120csubfull/NTU120_CSub.npz
  split: train
  data_type: j
  debug: false
  window_size: 64
  p_interval: [0.5, 1]
  aug_method: a123489
  intra_p: 0.5
  inter_p: 0.2
  thres: 64
  uniform: true
  partition: true

test_feeder_args:
  data_path: /kaggle/input/datasets/nguyenbaohuy05/ntu120csubfull/NTU120_CSub.npz
  split: test
  data_type: j
  debug: false
  window_size: 64
  p_interval: [0.95]
  thres: 64
  uniform: true
  partition: true

model_args:
  num_people: 2
  num_points: 24
  kernel_size: 7
  num_heads: 32
  attn_drop: 0.5
  head_drop: 0.0
  rel: true
  drop_path: 0.2
  type_1_size: [8, 8]
  type_2_size: [8, 12]
  type_3_size: [8, 8]
  type_4_size: [8, 12]
  mlp_ratio: 4.0
  index_t: true

prototype_args:
  multi_scale: true
  pyramid_levels: [2, 3]
  temporal_pooling: adaptive_mil
  scale_fusion: per_concept
  interaction_reasoning: true
  temporal_gru_enabled: true
  temporal_gru_hidden_dim: 64
  temporal_gru_layers: 1
  temporal_gru_dropout: 0.0
  temporal_gru_residual_init: 0.0
  refiner_enabled: true
  refiner_hidden_dim: 128
  parent_enabled: true
  center_loss_mode: pairwise_gap_hard_negative
  center_gap_margin: 0.20
  center_gap_topk: 5
  center_negative_margin: 0.10
  center_negative_weight: 0.50
  center_negative_topk: 10
  center_separation_margin: 0.15
  center_separation_topk: 5

residual_action_head: false
residual_action_weight: 0.0
action_logit_scale: 1.0
concept_score_mode: logit
concept_idf_power: 1.0

batch_size: 64
test_batch_size: 32
test_p_interval: [0.95]
base_lr: 0.0001
weight_decay: 0.0001
grad_clip: 1.0
# Jointly optimize grounding and symbolic composition. Graph supervision is
# introduced smoothly below instead of using a separate parent-only stage.
stage1_name: joint_grounding_composition
stage1_epochs: 15
stage2_epochs: 0
stage3_epochs: 0

checkpoint_max_missing_ratio: 0.02

# Defaults used outside the explicitly staged training loop.
loss_weights:
  concept: 0.25
  parent: 0.25
  graph: 0.10
  center: 0.05

# Single joint objective. Only the graph term is warmed up because its parent
# teacher is least reliable at initialization.
stage1_loss_weights:
  concept: 0.25
  parent: 0.25
  graph: 0.10
  center: 0.05

stage1_loss_warmup_epochs: 5
stage1_loss_warmup_start_weights:
  graph: 0.0

# Retained as a compatible fallback profile; stage 2 has zero epochs.
stage2_loss_weights:
  concept: 0.25
  parent: 0.25
  graph: 0.10
  center: 0.05

stage1_lr: 0.0001
stage2_lr: 0.00005
stage1_lr_schedule:
  1: 0.0001
  6: 0.00005
stage3_decoder_lr: 0.00005
stage3_backbone_lr: 0.00001
