# Main HCG-NS model: selected from the V3 ablation series.
#
# This is the standalone, fully resolved V3-E configuration.  It keeps the
# adaptive multi-scale concept decoder from V3-C and adds the fixed
# parent-concept graph regularizer.  Historical V3 configs remain under
# ablation_ntu120_csub_v31 for experiment reproducibility.
seed: 1
device: [0]
num_worker: 0
num_classes: 120
num_concepts: 102

concept_csv: ./concepts/ntu_action_concept_v2_4.csv
metadata_csv: ./concepts/ntu_concept_metadata_v2_4.csv
zero_is_negative: true

weights: /kaggle/input/datasets/nguyenbaohuy05/skateformer-pretrain/ntu120_CSub/SkateFormer_j.pt
work_dir: ./work_dir/hcg_ns/main_ntu120_csub

train_feeder_args:
  data_path: /kaggle/input/datasets/nguyenbaohuy05/ntu120csubfull/NTU120_CSub.npz
  split: train
  data_type: j
  debug: false
  window_size: 64
  p_interval: [0.5, 1]
  aug_method: a123489
  intra_p: 0.5
  inter_p: 0.2
  thres: 64
  uniform: true
  partition: true

test_feeder_args:
  data_path: /kaggle/input/datasets/nguyenbaohuy05/ntu120csubfull/NTU120_CSub.npz
  split: test
  data_type: j
  debug: false
  window_size: 64
  p_interval: [0.95]
  thres: 64
  uniform: true
  partition: true

model_args:
  num_people: 2
  num_points: 24
  kernel_size: 7
  num_heads: 32
  attn_drop: 0.5
  head_drop: 0.0
  rel: true
  drop_path: 0.2
  type_1_size: [8, 8]
  type_2_size: [8, 12]
  type_3_size: [8, 8]
  type_4_size: [8, 12]
  mlp_ratio: 4.0
  index_t: true

prototype_args:
  multi_scale: true
  pyramid_levels: [2, 3]
  temporal_pooling: adaptive_mil
  scale_fusion: per_concept
  interaction_reasoning: true
  scope_fusion: bounded
  scope_scale: 0.25
  parent_enabled: true

parent_weight: 0.35
residual_action_head: false
residual_action_weight: 0.1
action_logit_scale: 2.0
concept_score_mode: logit
concept_idf_power: 1.0

batch_size: 64
test_batch_size: 32
test_p_interval: [0.95]
base_lr: 0.0001
weight_decay: 0.0001
grad_clip: 1.0
stage1_epochs: 5
stage2_epochs: 10
stage3_epochs: 0

checkpoint_max_missing_ratio: 0.02

# Defaults used outside the explicitly staged training loop.
loss_weights:
  weak_concept: 0.25
  weak_positive: 1.0
  weak_negative: 0.25
  parent: 0.25
  graph: 0.10
  density: 0.05
  center: 0.05

# Ground parent concepts first; the graph teacher is not used yet.
stage1_loss_weights:
  weak_concept: 0.10
  weak_positive: 0.25
  weak_negative: 0.0
  parent: 1.0
  graph: 0.0
  density: 0.02
  center: 0.10

# Then regularize child concepts with the fixed parent-concept graph.
stage2_loss_weights:
  weak_concept: 0.25
  weak_positive: 1.0
  weak_negative: 0.25
  parent: 0.25
  graph: 0.10
  density: 0.05
  center: 0.05

stage1_lr: 0.0001
stage2_lr: 0.00005
stage3_decoder_lr: 0.00005
stage3_backbone_lr: 0.00001
