seed: 1
protocol: ntu120_cset
num_worker: 4
work_dir: ./work_dir/final_pipeline/ntu120_cset

phase: train_concept

feeder: feeders.feeder_ntu_concept.ConceptFeeder
train_feeder_args:
  data_path: ./data/ntu120/NTU120_CSet.npz
  split: train
  pseudo_label_npz: ./work_dir/final_pipeline/ntu120_cset/pseudo_labels/template_labels_train.npz
  num_concepts: 74
  window_size: 64
  p_interval: [0.5, 1]
  aug_method: a123489
  intra_p: 0.5
  inter_p: 0.2
  thres: 64
  uniform: True
  partition: True

test_feeder_args:
  data_path: ./data/ntu120/NTU120_CSet.npz
  split: test
  pseudo_label_npz: ./work_dir/final_pipeline/ntu120_cset/pseudo_labels/template_labels_test.npz
  num_concepts: 74
  window_size: 64
  p_interval: [0.95]
  thres: 64
  uniform: True
  partition: True

num_classes: 120
num_concepts: 74
backbone_dim: 192
backbone_ckpt: null
freeze_backbone: true
use_symbolic: true
symbolic_mode: learned

backbone_kwargs:
  num_classes: 120
  num_people: 2
  num_points: 24
  kernel_size: 7
  num_heads: 32
  attn_drop: 0.5
  head_drop: 0.0
  rel: true
  drop_path: 0.2
  type_1_size: [8, 8]
  type_2_size: [8, 12]
  type_3_size: [8, 8]
  type_4_size: [8, 12]
  mlp_ratio: 4.0
  index_t: true

decoder_kwargs:
  d_model: 256
  num_heads: 8
  num_layers: 2
  d_ff: 512
  dropout: 0.1
  use_self_attn: true
  mode: learned
  hidden_dim: 0

lambda_concept: 1.0
lambda_action: 1.0
loss_type: masked_bce

optimizer: AdamW
base_lr: 1.0e-3
min_lr: 1.0e-5
warmup_lr: 1.0e-7
warm_up_epoch: 3
weight_decay: 0.05
warmup_prefix: false
grad_clip: true
grad_max: 1.0

device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 20
start_epoch: 0
early_stop_patience: 5
save_epoch: 15
eval_interval: 1
log_interval: 50
print_log: true
save_score: true

concept_csv: ./concepts/ntu_rgbd_60_120.csv
