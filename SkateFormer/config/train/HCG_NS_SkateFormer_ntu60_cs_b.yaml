# HCG-NS-SkateFormer-RF v2.2: NTU60 Cross-Subject, bone modality.
# Same training/model settings as the joint config; only the feeder modality,
# pretrained SkateFormer stream, and output directory are changed.
seed: 1
device: [0]
num_worker: 0
work_dir: ./work_dir/hcg_ns/ntu60_cs_v22_interaction_bone
num_classes: 60
num_concepts: 92
concept_csv: ./concepts/ntu_action_concept_v2_2.csv
metadata_csv: ./concepts/ntu_concept_metadata_v2_2.csv
labels_csv: ./concepts/ntu_action_concept_v2_2_labels.csv
zero_is_negative: true
hierarchy_csv: ./concepts/ntu_concept_hierarchy_v2_2.csv
# Place the matching NTU60-CS SkateFormer bone checkpoint at this path.
weights: ./pretrained/ntu60_CSub/SkateFormer_b.pt

train_feeder_args:
  data_path: ./data/ntu/NTU60_CS.npz
  split: train
  data_type: b
  debug: False
  window_size: 64
  p_interval: [0.5, 1]
  aug_method: a123489
  intra_p: 0.5
  inter_p: 0.2
  thres: 64
  uniform: True
  partition: True

test_feeder_args:
  data_path: ./data/ntu/NTU60_CS.npz
  split: test
  data_type: b
  debug: False
  window_size: 64
  p_interval: [0.95]
  thres: 64
  uniform: True
  partition: True

model_args:
  num_people: 2
  num_points: 24
  kernel_size: 7
  num_heads: 32
  attn_drop: 0.5
  head_drop: 0.0
  rel: True
  drop_path: 0.2
  type_1_size: [8, 8]
  type_2_size: [8, 12]
  type_3_size: [8, 8]
  type_4_size: [8, 12]
  mlp_ratio: 4.0
  index_t: True

prototype_args:
  multi_scale: True
  pyramid_levels: [2, 3]
  interaction_reasoning: True
gate_floor: 0.05
parent_weight: 0.35
residual_action_head: false
residual_action_weight: 0.1

batch_size: 16
test_batch_size: 32
test_p_interval: [0.95]
base_lr: 0.0001
weight_decay: 0.0001
grad_clip: 1.0
stage1_epochs: 5
stage2_epochs: 10
stage3_epochs: 0

# Hard-negative pairs are reserved for a separate ablation run.
hard_negative_pairs: []
hard_negative_pairs_csv: null
hard_negative_margin: 0.2
checkpoint_max_missing_ratio: 0.02

loss_weights:
  weak_concept: 0.25
  weak_positive: 1.0
  weak_negative: 0.25
  parent: 0.25
  hierarchy: 0.10
  density: 0.05
  hard_negative: 0.00
  sparse: 0.001
  center: 0.05

stage1_loss_weights:
  weak_concept: 0.10
  weak_positive: 0.25
  weak_negative: 0.00
  parent: 1.00
  hierarchy: 0.50
  density: 0.02
  hard_negative: 0.00
  sparse: 0.001
  center: 0.10

stage2_loss_weights:
  weak_concept: 0.25
  weak_positive: 1.00
  weak_negative: 0.25
  parent: 0.25
  hierarchy: 0.10
  density: 0.05
  hard_negative: 0.00
  sparse: 0.001
  center: 0.05

stage1_lr: 0.0001
stage2_lr: 0.00005
stage3_decoder_lr: 0.00005
stage3_backbone_lr: 0.00001
