# SkateFormer Joint Modality + Joint Spatial-Temporal Concept Bottleneck & Symbolic Compatibility
phase: joint
pretrained_checkpoint: ./pretrained/ntu_cs/SkateFormer_j.pth
checkpoint: ./pretrained/ntu_cs/SkateFormer_j.pth
data: ./data/ntu/NTU60_CS.npz
work_dir: ./work_dir/ntu_cs/skateformer_joint_symbolic

data_type: j
num_class: 60
num_points: 24
num_people: 2
window_size: 64

# Neuro-Symbolic & Concept Bottleneck Parameters
concept_loss_weight: 0.20
concept_negative_weight: 0.10
concept_checkpoint: null
kg_s_weight: 0.02
kg_c_weight: 0.01

# Concept-GCN Architecture (C_KG Graph Adjacency Prior)
use_concept_gcn: False
concept_gcn_dropout: 0.2
symbolic_temperature: 0.70
symbolic_margin: 0.15
symbolic_weight: 0.50
action_loss_weight: 1.00

# Stage 1: learned prototype centers -- cosine match between a per-sample
# embedding (concept probs combined with a shared, learned concept-embedding
# table) and a learnable per-class center, warm-started from and anchored to
# the KG template (see train_joint.py --use-learned-centers help text).
use_learned_centers: true
concept_embed_dim: 32
center_anchor_weight: 0.10

# Stage 2: smooth the concept-embedding table (2a) and/or class centers (2b)
# with a small GCN over KG adjacency before matching. Reuses concept_gcn_dropout
# above as the dropout rate inside these GCNs. Requires use_learned_centers.
use_concept_embed_graph: true
use_center_graph: true

epochs: 30
lr: 0.001
weight_decay: 0.0001
batch_size: 32
num_workers: 4
device: 0
seed: 42
explain_every: 5
n_explain_actions: 10
save_score: true
