work_dir: ./work_dir/ntu60/xsub/ctrgcn_joint

# feeder
feeder: feeder_ntu.Feeder
train_feeder_args:
  data_path: d:/Thesis/NTU60_CS_sampled64.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  normalization: False
  random_rot: True
  p_interval: [1.0]
  vel: False
  bone: False

test_feeder_args:
  data_path: d:/Thesis/NTU60_CS_sampled64.npz
  split: test
  window_size: 64
  p_interval: [1.0]
  vel: False
  bone: False
  debug: False

# model
model: model_dcln.DCLN
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  graph: graph_ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'

#optim
weight_decay: 0.0004
base_lr: 0.1
lr_decay_rate: 0.1
step: [35, 55]        # used only when two_stage: False
warm_up_epoch: 5

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 65
eval_interval: 64
nesterov: True

# ── 2-Stage Training ──────────────────────────────────────────────────────────
# Set two_stage: True to activate.  Leave False to use classic end-to-end mode.
two_stage: True

# Stage 1 (backbone + concept modules, ConceptLogicLayers FROZEN)
#   Epochs 1 → stage1_epoch  :  full CTR-GCN + MLDecoder + PRN optimisation
stage1_epoch: 40              # transition point (exclusive upper bound of Stage 1)
stage1_step: [25, 35]         # LR decay epochs within Stage 1

# Stage 2 (backbone FROZEN, ConceptLogicLayers UNLOCKED)
#   Epochs (stage1_epoch+1) → num_epoch  :  logic rule learning
stage2_backbone_lr: 0.001     # light fine-tune LR for concept modules (PRN, MLDecoder)
stage2_logic_lr: 0.1          # fresh LR for ConceptLogicLayers
stage2_step: [12, 20]         # LR decay epochs relative to Stage 2 start (epoch 41=1, 42=2 …)
